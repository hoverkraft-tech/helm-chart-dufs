# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    directories:
      - "/"
    open-pull-requests-limit: 3
    labels:
      - "github_actions"
    schedule:
      interval: "weekly"
      day: friday
      time: "04:00"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dufs"
      - "/dufs/templates"
      - "/dufs/templates/tests"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: "weekly"
      day: friday
      time: "04:10"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "helm"
    directory: "/dufs"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: "weekly"
      day: friday
      time: "04:20"
    groups:
      helm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: "weekly"
      day: friday
      time: "04:30"
    groups:
      devcontainer-dependencies:
        patterns:
          - "*"
