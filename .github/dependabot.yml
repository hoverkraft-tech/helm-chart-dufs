# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    directories:
      - "/"
    open-pull-requests-limit: 3
    labels:
      - "github_actions"
    schedule:
      interval: "weekly"
      day: friday
      time: "04:00"
