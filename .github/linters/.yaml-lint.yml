extends: default

# Raw Go templates are not YAML. Keep each exception explicit.
ignore: |
  **/dufs/templates/configmap.yaml
  **/dufs/templates/deployment.yaml
  **/dufs/templates/hpa.yaml
  **/dufs/templates/ingress.yaml
  **/dufs/templates/serviceaccount.yaml
  **/dufs/templates/service.yaml
  **/dufs/templates/tests/test-connection.yaml

rules:
  document-start: disable
  line-length: disable
