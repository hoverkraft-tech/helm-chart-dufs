name-template: "Version $RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

categories:
  - title: "🚨 Breaking Changes"
    labels:
      - "breaking"
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "🧩 Dependencies"
    labels:
      - "dependencies"
  - title: "🤖 CI/CD"
    labels:
      - "ci"
  - title: "📚 Documentation"
    labels:
      - "documentation"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "refactor"
      - "performance"
      - "style"
      - "test"

exclude-labels:
  - "skip-changelog"

version-resolver:
  major:
    labels:
      - "release-major"
  minor:
    labels:
      - "release-minor"
  patch:
    labels:
      - "release-patch"
  default: patch

# Labels PRs automatically from Conventional Commits titles,
# so changelogs are categorized without manual labeling.
autolabeler:
  # Version bump
  - label: "release-major"
    title:
      - "/^\\w+(\\(.+\\))?!:/"
      - "/^BREAKING CHANGE:/"
    body:
      - "/BREAKING CHANGE:/"
  - label: "release-minor"
    title:
      - "/^feat(\\(.+\\))?:/"
  # Categories
  - label: "breaking"
    title:
      - "/^\\w+(\\(.+\\))?!:/"
  - label: "feature"
    title:
      - "/^feat(\\(.+\\))?:/"
  - label: "fix"
    title:
      - "/^fix(\\(.+\\))?:/"
  - label: "dependencies"
    title:
      - "/^(deps|build)(\\(.+\\))?:/"
    branch:
      - "/^dependabot\\//"
  - label: "ci"
    title:
      - "/^ci(\\(.+\\))?:/"
  - label: "documentation"
    title:
      - "/^docs(\\(.+\\))?:/"
    files:
      - "*.md"
  - label: "chore"
    title:
      - "/^chore(\\(.+\\))?:/"
  - label: "refactor"
    title:
      - "/^refactor(\\(.+\\))?:/"
  - label: "performance"
    title:
      - "/^perf(\\(.+\\))?:/"
  - label: "style"
    title:
      - "/^style(\\(.+\\))?:/"
  - label: "test"
    title:
      - "/^test(\\(.+\\))?:/"
