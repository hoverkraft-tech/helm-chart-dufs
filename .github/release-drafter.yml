name-template: "Version $RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

categories:
  - title: "🚨 Breaking Changes"
    when:
      labels:
        - "breaking"
  - title: "🚀 Features"
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "fix"
        - "bug"
  - title: "🧩 Dependencies"
    when:
      labels:
        - "dependencies"
  - title: "🤖 CI/CD"
    when:
      labels:
        - "ci"
  - title: "📚 Documentation"
    when:
      labels:
        - "documentation"
  - title: "🧰 Maintenance"
    when:
      labels:
        - "chore"
        - "refactor"
        - "performance"
        - "style"
        - "test"
  - type: "pre-exclude"
    when:
      labels:
        - "skip-changelog"
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "release-major"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "release-minor"
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels:
        - "release-patch"

# Labels PRs automatically from Conventional Commits titles,
# so changelogs are categorized without manual labeling.
autolabeler:
  # Version bump
  - label: "release-major"
    title:
      - "/^\\w+(\\(.+\\))?!:/"
      - "/^BREAKING CHANGE:/"
    body:
      - "/BREAKING CHANGE:/"
  - label: "release-minor"
    title:
      - "/^feat(\\(.+\\))?:/"
  # Categories
  - label: "breaking"
    title:
      - "/^\\w+(\\(.+\\))?!:/"
  - label: "feature"
    title:
      - "/^feat(\\(.+\\))?:/"
  - label: "fix"
    title:
      - "/^fix(\\(.+\\))?:/"
  - label: "dependencies"
    title:
      - "/^(deps|build)(\\(.+\\))?:/"
    branch:
      - "/^dependabot\\//"
  - label: "ci"
    title:
      - "/^ci(\\(.+\\))?:/"
  - label: "documentation"
    title:
      - "/^docs(\\(.+\\))?:/"
    files:
      - "*.md"
  - label: "chore"
    title:
      - "/^chore(\\(.+\\))?:/"
  - label: "refactor"
    title:
      - "/^refactor(\\(.+\\))?:/"
  - label: "performance"
    title:
      - "/^perf(\\(.+\\))?:/"
  - label: "style"
    title:
      - "/^style(\\(.+\\))?:/"
  - label: "test"
    title:
      - "/^test(\\(.+\\))?:/"
