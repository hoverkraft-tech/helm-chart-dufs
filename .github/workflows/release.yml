name: 🚀 Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-branches:
    name: Check branches
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        run: |
          if [[ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "This action can only be run on the ${{ github.event.repository.default_branch }} branch"
            exit 1
          fi

  update_release_draft:
    name: Draft a new release
    # we want to publish a new tag only if ci succeeds
    needs: check-branches
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      latestRelease: ${{ steps.update_release_draft.outputs.tag_name }}
    steps:
      # create a new release
      - id: update_release_draft
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # ratchet:release-drafter/release-drafter@v7
        with:
          publish: true

  ci:
    needs: update_release_draft
    name: Continuous Integration
    uses: ./.github/workflows/__shared-ci.yml
    with:
      tag: ${{ needs.update_release_draft.outputs.latestRelease }}
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets: inherit

  helm-publish:
    name: "Helm: push chart to OCI registry"
    needs: [update_release_draft, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for keyless cosign sign/attest (Sigstore OIDC)
      packages: write  # required to push the chart, its signature and attestations to ghcr.io
      pull-requests: write
    outputs:
      chart-image: ${{ steps.push-chart.outputs.image }}
      chart-digest: ${{ steps.push-chart.outputs.digest }}
    steps:
      # Get a local copy of the code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # install tools with mise
      - name: install tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # ratchet:jdx/mise-action@v5

      - name: login to OCI registry
        run: |
          echo "+ login to OCI registry"
          helm registry login ${OCI_REGISTRY} -u "${OCI_REGISTRY_USERNAME}" -p "${OCI_REGISTRY_PASSWORD}"
        env:
          OCI_REGISTRY: ghcr.io
          OCI_REGISTRY_USERNAME: ${{ github.actor }}
          OCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: update helm chart version
        run: |
          cd "${CHART_PATH}"
          echo "+ update helm chart version to ${VERSION}"
          sed -i "s/^version: .*/version: ${VERSION}/g" Chart.yaml
          # we don't want to touch appVersion in this case
          # sed -i "s/^appVersion: .*/appVersion: ${VERSION}/g" Chart.yaml
        env:
          CHART_PATH: ${{github.workspace}}/dufs
          VERSION: ${{ needs.update_release_draft.outputs.latestRelease }}

      - name: update helm chart docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # ratchet:losisin/helm-docs-github-action@v2.0.1
        with:
          chart-search-root: dufs
          git-push: "false"

      - name: update chart README.md version badge
        run: |
          echo "+ update chart README.md version badge to ${VERSION}"
          sed -i -E "s|!\[Version: [^]]+\]\(https://img.shields.io/badge/Version-[^)]+\)|![Version: ${VERSION}](https://img.shields.io/badge/Version-${VERSION}-informational?style=flat-square)|g" dufs/README.md
        env:
          VERSION: ${{ needs.update_release_draft.outputs.latestRelease }}

      - name: update root README.md version badge
        run: |
          echo "+ update root README.md version badge to ${VERSION}"
          sed -i -E "s|\[!\[Version\]\(https://img.shields.io/badge/Version-[^)]+\)|[![Version](https://img.shields.io/badge/Version-${VERSION}-informational?style=flat-square)|g" README.md
        env:
          VERSION: ${{ needs.update_release_draft.outputs.latestRelease }}

      - name: update helm values schema json
        uses: losisin/helm-values-schema-json-action@9ed68d9d464a5e6f7f5fc1f3dc071828cf7d13a2 # ratchet:losisin/helm-values-schema-json-action@v3.2.0
        with:
          values: dufs/values.yaml

      - uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@4a6ed33ba735d57ebbcd89fe8ed35134de599a67 # ratchet:hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@0.39.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch: release-chart-${{ needs.update_release_draft.outputs.latestRelease }}
          title: "ci: release chart ${{ needs.update_release_draft.outputs.latestRelease }}"
          body: Release app and chart version ${{ needs.update_release_draft.outputs.latestRelease }}
          commit-message: |
            ci: release chart ${{ needs.update_release_draft.outputs.latestRelease }}

            [skip ci]

      - name: refresh main branch
        run: |
          set -x
          echo "refreshing current branch"
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git fetch --all
          git checkout ${BRANCH_NAME}
          git pull --rebase
          echo "commit id: $(git rev-parse --short HEAD)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      # Package and push the chart, capturing the immutable OCI digest so that
      # signing and attestations target the exact artifact that was published.
      - name: push helm chart to OCI registry
        id: push-chart
        run: |
          set -euo pipefail
          chart_ref="${OCI_REGISTRY}/${OCI_REGISTRY_CHART_REPOSITORY}/dufs"
          destination="$(mktemp -d)"

          echo "+ package chart ${VERSION}"
          helm package "${CHART_PATH}" --version "${VERSION}" --destination "${destination}"

          echo "+ push ${chart_ref}:${VERSION}"
          push_output="$(helm push "${destination}"/dufs-"${VERSION}".tgz "oci://${OCI_REGISTRY}/${OCI_REGISTRY_CHART_REPOSITORY}" 2>&1)"
          echo "${push_output}"

          digest="$(echo "${push_output}" | grep -oE 'sha256:[a-f0-9]{64}' | head -n1)"
          if [[ -z "${digest}" ]]; then
            echo "ERROR: could not determine the pushed chart digest" >&2
            exit 1
          fi

          echo "image=${chart_ref}:${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image-digest=${chart_ref}:${VERSION}@${digest}" >> "${GITHUB_OUTPUT}"
        env:
          CHART_PATH: ${{ github.workspace }}/dufs
          VERSION: ${{ needs.update_release_draft.outputs.latestRelease }}
          OCI_REGISTRY: ghcr.io
          OCI_REGISTRY_CHART_REPOSITORY: hoverkraft-tech/charts

      # 1. Sigstore signature (keyless cosign sign) on the immutable chart digest
      - name: sign chart with cosign
        uses: hoverkraft-tech/ci-github-container/actions/helm/sign-chart@ec1cd960fb1a1908ac21680756eb49a4c8f018d5 # ratchet:hoverkraft-tech/ci-github-container/actions/helm/sign-chart@0.40.0
        with:
          charts: ${{ steps.push-chart.outputs.image-digest }}
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.actor }}
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. SLSA build provenance attestation (cosign attest, keyless)
      - name: attest SLSA provenance
        run: |
          set -euo pipefail
          predicate="$(mktemp).json"
          jq -n \
            --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            '{
              _type: "https://in-toto.io/Statement/v1",
              subject: [],
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: {
                buildDefinition: {
                  buildType: ( $repo + "/.github/workflows/release.yml" ),
                  externalParameters: { repository: $repo, ref: $ref, workflow: $workflow },
                  internalParameters: { github: { event_name: env.GITHUB_EVENT_NAME, repository_id: env.GITHUB_REPOSITORY_ID } }
                },
                runDetails: {
                  builder: { id: ( $repo + "/actions/runs/" + env.GITHUB_RUN_ID ) },
                  metadata: { invocationId: ( env.GITHUB_RUN_ID + "/" + env.GITHUB_RUN_ATTEMPT ) }
                }
              }
            }' > "${predicate}"
          COSIGN_EXPERIMENTAL=1 cosign attest --yes \
            --predicate "${predicate}" \
            --type slsaprovenance1 \
            "${{ steps.push-chart.outputs.image-digest }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. SBOM (SPDX) generated from the packaged chart and attached via cosign attest
      - name: generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # ratchet:anchore/sbom-action@v0.24.3
        with:
          path: ${{ github.workspace }}/dufs
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: dufs-chart-sbom

      - name: attest SPDX SBOM
        run: |
          set -euo pipefail
          COSIGN_EXPERIMENTAL=1 cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.push-chart.outputs.image-digest }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the Artifact Hub repository metadata (artifacthub-repo.yml) to the
      # special "artifacthub.io" tag so Artifact Hub can fetch it for features
      # like "Verified publisher" (it cannot read the file from the git repo).
      - name: publish Artifact Hub repository metadata
        run: |
          set -euo pipefail
          echo "+ push artifacthub-repo.yml to ${OCI_REPOSITORY}:artifacthub.io"
          oras push \
            "${OCI_REPOSITORY}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
        env:
          OCI_REPOSITORY: ghcr.io/hoverkraft-tech/charts/dufs
