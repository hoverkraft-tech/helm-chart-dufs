# Artifact Hub repository metadata file
# See https://artifacthub.io/docs/topics/repositories/helm-charts-repositories/
#
# The repositoryID enables the "Verified Publisher" flag. It is displayed on
# the repository card (ID) in the Artifact Hub control panel after the
# repository has been added. Fill it in once the repository is registered.
#
# For this OCI-based repository, this file must also be pushed to the registry
# (see https://artifacthub.io/docs/topics/repositories/helm-charts-repositories/#oci-support):
#
#   oras push \
#     ghcr.io/hoverkraft-tech/charts/dufs:artifacthub.io \
#     --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
#     artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
#
# repositoryID: <fill after registering the repository on artifacthub.io>
