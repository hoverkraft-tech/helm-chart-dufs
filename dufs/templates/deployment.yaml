apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dufs.fullname" . }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=The installer selects the release namespace.
    checkov.io/skip2: CKV2_K8S_6=The installer supplies the cluster-specific network policy.
  labels:
    {{- include "dufs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dufs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        checkov.io/skip1: CKV2_K8S_6=The installer supplies the cluster-specific network policy.
      {{- else }}
      annotations:
        checkov.io/skip1: CKV2_K8S_6=The installer supplies the cluster-specific network policy.
      {{- end }}
      labels:
        {{- include "dufs.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dufs.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.assetsZipUrl }}
      initContainers:
        - name: setup-theme
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          command:
            - sh
            - -c
            - |
                set -ex
                cd /assets
                wget --no-verbose --tries=3 --timeout=15 -O assets.zip {{ .Values.assetsZipUrl | quote }}
                unzip assets.zip
                rm assets.zip
          volumeMounts:
            - name: dufs-assets
              mountPath: /assets
              readOnly: false
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          env:
            - name: DUFS_CONFIG
              value: '/dufs/config/dufs.yaml'
            - name: DUFS_BIND
              value: '0.0.0.0'
            - name: DUFS_PORT
              value: '5000'
            {{- if .Values.assetsZipUrl }}
            - name: DUFS_ASSETS
              value: '/assets'
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{- include "dufs.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /dufs/config
              readOnly: true
          {{- if .Values.assetsZipUrl }}
            - name: dufs-assets
              mountPath: /assets
              readOnly: false
          {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dufs.fullname" . }}
      {{- if .Values.assetsZipUrl }}
        - name: dufs-assets
          emptyDir: {}
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
