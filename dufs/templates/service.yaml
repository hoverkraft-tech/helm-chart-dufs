apiVersion: v1
kind: Service
metadata:
  name: {{ include "dufs.fullname" . }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=The installer selects the release namespace.
  labels:
    {{- include "dufs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dufs.selectorLabels" . | nindent 4 }}
