apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dufs.fullname" . }}-test-connection"
  labels:
    {{- include "dufs.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_8=The Helm test exits after its connection check.
    checkov.io/skip2: CKV_K8S_9=The Helm test exits after its connection check.
    checkov.io/skip3: CKV_K8S_21=The installer selects the release namespace.
    checkov.io/skip4: CKV2_K8S_6=The Helm test uses the release network context.
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
      command: ['wget']
      args: ['{{ include "dufs.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
